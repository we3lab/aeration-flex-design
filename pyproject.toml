[tool.poetry]
name = "aeration-flexibility"
version = "0.1.0"
description = "Sizing and operating oxygen, air and battery storage for flexible wastewater aeration under time-varying electricity tariffs"
authors = ["Daly Wettermark", "Jose Bolorinos", "Meagan S. Mauter"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10, <3.13"
numpy = ">=1.26.4"
pandas = ">=2.2.2"
scipy = ">=1.15.3"
matplotlib = ">=3.10.3"
cvxpy = ">=1.7.3"
scikit-learn = ">=1.5"
pillow = ">=10.0"
psutil = ">=5.9"
python-dotenv = ">=1.0"
eeco = {git = "https://github.com/we3lab/eeco.git", branch = "cvxpy-fixes"}
# Optional
gurobipy = {version = ">=11.0", optional = true}

[tool.poetry.extras]
gurobi = ["gurobipy"]

[tool.poetry.group.dev.dependencies]
black = ">25.1.0"

[tool.black]
line-length = 100

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
